services:
  - type: web
    name: hievents-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: SSL_MODE
        value: "off"
      - key: APP_NAME
        value: Hi.Events
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://api.tickets.cortdevs.com
      - key: APP_FRONTEND_URL
        value: https://tickets.cortdevs.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://tickets.cortdevs.com
      - key: APP_CDN_URL
        value: https://media.cortdevs.com
      - key: APP_TRUSTED_PROXIES
        value: "*"
      - key: APP_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_PUBLIC_DISK
        value: s3-public
      - key: FILESYSTEM_PRIVATE_DISK
        value: s3-private
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USERNAME
        value: resend
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: ssl
      - key: MAIL_FROM_ADDRESS
        value: tickets@cortdevs.com
      - key: MAIL_FROM_NAME
        value: Tickets
